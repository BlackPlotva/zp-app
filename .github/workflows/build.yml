- name: Install dependencies
  run: |
    sudo apt-get update
    sudo apt-get install -y \
      build-essential \
      git \
      ffmpeg \
      libsdl2-dev \
      libsdl2-image-dev \
      libsdl2-mixin-dev \
      libsdl2-ttf-dev \
      libportmidi-dev \
      libswscale-dev \
      libavformat-dev \
      libavcodec-dev \
      zlib1g-dev \
      autoconf \
      automake \
      libtool \
      pkg-config \
      gettext \
      c语言-compiler \
      cmake \
      zip \
      unzip
