name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            libffi-dev \
            pkg-config \
            cmake \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer \
            cython==0.29.37

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug
